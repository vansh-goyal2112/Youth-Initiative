name: CPRG305 fixture-backed Docker execution
on:
  push:
    branches: [cprg305-isolated-qa]
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - name: Build and start application on internal network
        run: |
          mkdir -p evidence
          printf 'NEXT_PUBLIC_FIREBASE_API_KEY=demo-local-test-key\nNEXT_PUBLIC_APP_URL=http://youth-app:3000\n' > /tmp/qa.env
          printf 'Cg==' > /tmp/qa-key
          node scripts/install-cprg305-fixtures.mjs
          docker build --secret id=env_local,src=/tmp/qa.env --secret id=firebase_key_b64,src=/tmp/qa-key -t youth-qa .
          docker pull node:22-alpine
          docker network create --internal cprg305
          docker run -d --network cprg305 --name youth-app youth-qa
          docker version > evidence/docker.txt
          docker network inspect cprg305 --format '{{.Name}} internal={{.Internal}}' >> evidence/docker.txt
          git log -2 --format='%H %s' > evidence/build.txt
      - name: Run HTTP functional and performance checks across containers
        run: |
          docker run --rm --network cprg305 -v "$PWD/scripts/cprg305-qa.mjs:/qa.mjs:ro" -v "$PWD/evidence:/evidence" node:22-alpine node /qa.mjs
      - name: Capture application logs
        if: always()
        run: docker logs youth-app > evidence/application.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cprg305-docker-evidence
          path: evidence/
