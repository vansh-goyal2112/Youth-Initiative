name: CPRG305 constrained network and Excel import
on:
  push:
    branches: [cprg305-isolated-qa]
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - name: Build and start application on internal network
        run: |
          mkdir -p evidence
          printf 'NEXT_PUBLIC_FIREBASE_API_KEY=demo-local-test-key\nNEXT_PUBLIC_APP_URL=http://youth-app:3000\n' > /tmp/qa.env
          printf 'Cg==' > /tmp/qa-key
          node scripts/install-cprg305-fixtures.mjs
          docker build --secret id=env_local,src=/tmp/qa.env --secret id=firebase_key_b64,src=/tmp/qa-key -t youth-qa .
          docker pull node:22-alpine
          docker network create --internal cprg305
          docker run -d --network cprg305 --name youth-app youth-qa
          docker version > evidence/docker.txt
          docker network inspect cprg305 --format '{{.Name}} internal={{.Internal}}' >> evidence/docker.txt
          git log -2 --format='%H %s' > evidence/build.txt
      - name: Test constrained network with Chrome
        run: |
          APP_IP=$(docker inspect youth-app --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --no-proxy-server --remote-debugging-port=9222 --user-data-dir=/tmp/cprg305-chrome about:blank > evidence/chrome.log 2>&1 &
          node scripts/cprg305-throttle.mjs "http://$APP_IP:3000" > evidence/throttled-network.json
          cat evidence/throttled-network.json
      - name: Run batch Excel import in Docker
        if: always()
        run: |
          docker build --target deps -t youth-qa-deps .
          docker run --rm --network cprg305 -v "$PWD/src:/app/src:ro" -v "$PWD/scripts/cprg305-import.mjs:/app/import.mjs:ro" youth-qa-deps node import.mjs "bfd580f7e1da43ba85ad8bacb20ea00da6e5b219" > evidence/batch-import.json
          cat evidence/batch-import.json
      - name: Capture application logs
        if: always()
        run: docker logs youth-app > evidence/application.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cprg305-docker-evidence
          path: evidence/