name: Deploy Youth Initiative to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: youth-initiative-rg
  AZURE_CONTAINER_APP: youth-initiative-dev
  ACR_NAME: youthinitiativeacrvg
  ACR_SERVER: youthinitiativeacrvg.azurecr.io
  IMAGE_NAME: youth-initiative

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Create temporary build environment file
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}

          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

          EMAIL_FROM: "SAIT Youth Initiative <onboarding@resend.dev>"
          EMAIL_REPLY_TO: "youth.programs@sait.ca"

          NEXT_PUBLIC_APP_URL: "https://youth-initiative-dev.delightfulpebble-0551d09b.canadacentral.azurecontainerapps.io"

        run: |
          python3 - <<'PY'
          import json
          import os

          keys = [
              "NEXT_PUBLIC_FIREBASE_API_KEY",
              "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN",
              "NEXT_PUBLIC_FIREBASE_PROJECT_ID",
              "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",
              "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID",
              "NEXT_PUBLIC_FIREBASE_APP_ID",
              "NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY",
              "FIREBASE_ADMIN_PROJECT_ID",
              "FIREBASE_ADMIN_CLIENT_EMAIL",
              "FIREBASE_ADMIN_PRIVATE_KEY",
              "RESEND_API_KEY",
              "EMAIL_FROM",
              "EMAIL_REPLY_TO",
              "NEXT_PUBLIC_APP_URL",
          ]

          with open(".env.local", "w", encoding="utf-8") as file:
              for key in keys:
                  value = os.environ.get(key, "")
                  file.write(f"{key}={json.dumps(value)}\n")
          PY

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            --secret id=env_local,src=.env.local \
            -t "$ACR_SERVER/$IMAGE_NAME:${GITHUB_SHA}" \
            -t "$ACR_SERVER/$IMAGE_NAME:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "$ACR_SERVER/$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$ACR_SERVER/$IMAGE_NAME:latest"

      - name: Deploy image to Azure Container Apps
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_SERVER/$IMAGE_NAME:${GITHUB_SHA}"

      - name: Remove temporary environment file
        if: always()
        run: rm -f .env.local

      - name: Show deployed application URL
        run: |
          echo "Deployment completed."
          echo "https://youth-initiative-dev.delightfulpebble-0551d09b.canadacentral.azurecontainerapps.io"